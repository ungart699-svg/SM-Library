<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Library - Log In</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, 'Segoe UI', Arial, sans-serif;
            background: #ffffff;
            margin: 0;
            padding: 60px 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .badge {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            background: #2563eb;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            margin-bottom: 18px;
        }

        h2 { font-family: Georgia, 'Times New Roman', serif; color: #2563eb; font-size: 2.2rem; margin: 0 0 6px 0; text-align: center; font-weight: 700; }
        .subtitle { color: #6b7280; font-size: 0.95rem; margin: 0 0 32px 0; text-align: center; }

        .login-card {
            background: white;
            width: 100%;
            max-width: 400px;
            border-radius: 12px;
            border: 1px solid #e5e7eb;
            padding: 32px;
        }

        .login-card h3 {
            color: #2563eb;
            font-size: 1.15rem;
            font-weight: 700;
            margin: 0 0 22px 0;
        }

        .input-row {
            display: flex;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            overflow: hidden;
            margin-bottom: 14px;
        }
        .input-row:focus-within { border-color: #2563eb; }

        .input-icon {
            background: #fafafa;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 44px;
            font-size: 16px;
            flex-shrink: 0;
            color: #6b7280;
        }

        .input-row input {
            flex: 1;
            border: none;
            background: white;
            padding: 13px 12px;
            font-size: 15px;
            outline: none;
            min-width: 0;
        }

        .toggle-password {
            background: white;
            color: #6b7280;
            border: none;
            border-left: 1px solid #d1d5db;
            width: 44px;
            cursor: pointer;
            font-size: 15px;
            flex-shrink: 0;
        }
        .toggle-password:hover { background: #fafafa; }

        button.login-btn {
            width: 100%;
            padding: 13px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 8px;
        }
        button.login-btn:hover { background: #1d4ed8; }

        .error {
            background: #fef2f2;
            border: 1px solid #fecaca;
            color: #dc2626;
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 14px;
            font-size: 14px;
            text-align: center;
        }

        .link {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
            color: #6b7280;
        }
        .link a { color: #2563eb; font-weight: 600; text-decoration: none; }
        .link a:hover { text-decoration: underline; }

        @media (max-width: 480px) {
            h2 { font-size: 1.7rem; }
        }
    </style>
</head>
<body>

    <div class="badge">📚</div>
    <h2>Smart Library System</h2>
    <p class="subtitle">Book Recommendation System</p>

    <div class="login-card">
        <h3>Log in to your account</h3>

        {% if error %}
            <div class="error">{{ error }}</div>
        {% endif %}

        <form method="POST" action="{{ url_for('auth.login') }}">
            <div class="input-row">
                <div class="input-icon">📧</div>
                <input type="email" name="email" placeholder="Enter Email" required>
            </div>

            <div class="input-row">
                <div class="input-icon">🔑</div>
                <input type="password" name="password" id="password-field" placeholder="Enter Password" required>
                <button type="button" class="toggle-password" id="toggle-btn" onclick="togglePassword()">👁</button>
            </div>

            <button type="submit" class="login-btn">Log In</button>
        </form>

        <div class="link">Don't have an account? <a href="{{ url_for('auth.signup') }}">Sign up</a></div>
    </div>

<script>
function togglePassword() {
    const field = document.getElementById('password-field');
    const btn = document.getElementById('toggle-btn');
    if (field.type === 'password') {
        field.type = 'text';
        btn.textContent = '🙈';
    } else {
        field.type = 'password';
        btn.textContent = '👁';
    }
}
</script>

</body>
</html>
